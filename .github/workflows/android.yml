name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_API_BASE_URL: https://hailite-manager.vercel.app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install locked dependencies
        run: npm ci
      - name: Validate store configuration
        run: npm run store:validate
      - name: Build and sync mobile application
        run: npm run build:mobile
      - name: Verify Android project and build artifacts
        working-directory: android
        run: ./gradlew --no-daemon lintRelease testDebugUnitTest assembleDebug bundleRelease
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v7
        with:
          name: hailite-manager-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v7
        with:
          name: hailite-manager-unsigned-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
