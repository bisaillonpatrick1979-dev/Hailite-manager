name: Android signed release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode Google Play (entier strictement croissant)"
        required: true
        default: "1"
        type: string
      version_name:
        description: "versionName affiché (ex. 1.0.0)"
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: read

concurrency:
  group: android-signed-release
  cancel-in-progress: false

jobs:
  release:
    name: Build signed Play AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ inputs.version_code }}
      VERSION_NAME: ${{ inputs.version_name }}
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Validate release inputs and signing secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || { echo "::error::version_code doit être un entier positif."; exit 1; }
          (( VERSION_CODE <= 2100000000 )) || { echo "::error::version_code dépasse la limite Google Play de 2100000000."; exit 1; }
          [[ -n "$VERSION_NAME" ]] || { echo "::error::version_name est requis."; exit 1; }
          for name in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_STORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "::error::Secret GitHub manquant: $name"; exit 1; }
          done

      - name: Install locked dependencies
        run: npm ci

      - name: Verify code and store readiness
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run store:validate

      - name: Build and sync mobile application
        run: npm run build:mobile

      - name: Restore upload keystore
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > hailite-manager-upload.jks
          chmod 600 hailite-manager-upload.jks
          cat > keystore.properties <<EOF
          storeFile=../hailite-manager-upload.jks
          storePassword=$ANDROID_UPLOAD_STORE_PASSWORD
          keyAlias=$ANDROID_UPLOAD_KEY_ALIAS
          keyPassword=$ANDROID_UPLOAD_KEY_PASSWORD
          EOF
          chmod 600 keystore.properties

      - name: Build signed release bundle
        working-directory: android
        run: >-
          ./gradlew --no-daemon lintRelease testDebugUnitTest bundleRelease
          -PreleaseVersionCode="$VERSION_CODE"
          -PreleaseVersionName="$VERSION_NAME"

      - name: Verify AAB signature and version
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          ./gradlew --no-daemon :app:properties \
            -PreleaseVersionCode="$VERSION_CODE" \
            -PreleaseVersionName="$VERSION_NAME" >/dev/null
          sha256sum "$AAB" | tee app-release.aab.sha256

      - name: Upload signed Play bundle
        uses: actions/upload-artifact@v7
        with:
          name: hailite-manager-v${{ inputs.version_name }}-signed-aab
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app-release.aab.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        working-directory: android
        shell: bash
        run: rm -f keystore.properties hailite-manager-upload.jks
