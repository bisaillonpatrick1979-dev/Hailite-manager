name: Android signed release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Unused Google Play versionCode (positive integer)'
        required: true
        type: string
      version_name:
        description: 'Displayed versionName (for example 1.0.0)'
        required: true
        default: '1.0.0'
        type: string

permissions:
  contents: read

concurrency:
  group: android-signed-release
  cancel-in-progress: false

jobs:
  release:
    name: Prepare signed AAB for Play testing
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Configure required reviewers and allowed branches on this environment.
    environment: google-play-release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Validate release inputs and signing secrets
        env:
          RELEASE_VERSION_CODE: ${{ inputs.version_code }}
          RELEASE_VERSION_NAME: ${{ inputs.version_name }}
          UPLOAD_KEY_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, re
          value = os.environ['RELEASE_VERSION_CODE']
          if not re.fullmatch(r'[1-9][0-9]{0,9}', value) or int(value) > 2100000000:
              raise SystemExit('Invalid versionCode')
          name = os.environ['RELEASE_VERSION_NAME']
          if not name.strip() or len(name) > 64 or any(ord(c) < 32 for c in name):
              raise SystemExit('Invalid versionName')
          if any(not os.environ.get(key) for key in ['UPLOAD_KEY_BASE64', 'UPLOAD_STORE_PASSWORD', 'UPLOAD_KEY_ALIAS', 'UPLOAD_KEY_PASSWORD']):
              raise SystemExit('Missing Android upload-key secrets in google-play-release')
          PY
      - name: Install and validate
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run store:validate
          npm run audit
          python3 -m unittest discover -s tests -p 'test_android_artifact.py'
      - name: Build the complete mobile application
        run: npm run build:mobile
      - name: Restore protected upload key
        env:
          UPLOAD_KEY_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          names = ['UPLOAD_KEY_BASE64', 'UPLOAD_STORE_PASSWORD', 'UPLOAD_KEY_ALIAS', 'UPLOAD_KEY_PASSWORD']
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('Missing Android upload-key secrets in google-play-release')
          os.umask(0o077)
          key = Path(os.environ['RUNNER_TEMP']) / 'hailite-upload.jks'
          key.write_bytes(base64.b64decode(os.environ['UPLOAD_KEY_BASE64'], validate=True))
          def escape(value):
              return ''.join('\\u%04x' % int.from_bytes(value.encode('utf-16-be')[i:i+2], 'big') for i in range(0, len(value.encode('utf-16-be')), 2))
          values = {'storeFile': str(key), 'storePassword': os.environ['UPLOAD_STORE_PASSWORD'],
                    'keyAlias': os.environ['UPLOAD_KEY_ALIAS'], 'keyPassword': os.environ['UPLOAD_KEY_PASSWORD']}
          Path('android/keystore.properties').write_text('\n'.join(k + '=' + escape(v) for k, v in values.items()) + '\n')
          PY
          keytool -list -keystore "$RUNNER_TEMP/hailite-upload.jks" -alias "$UPLOAD_KEY_ALIAS" -storepass:env UPLOAD_STORE_PASSWORD >/dev/null
      - name: Build signed release
        working-directory: android
        env:
          RELEASE_VERSION_CODE: ${{ inputs.version_code }}
          RELEASE_VERSION_NAME: ${{ inputs.version_name }}
        run: ./gradlew --no-daemon lintRelease testDebugUnitTest bundleRelease -PrequireReleaseSigning=true "-PreleaseVersionCode=$RELEASE_VERSION_CODE" "-PreleaseVersionName=$RELEASE_VERSION_NAME"
      - name: Verify the exact signed AAB
        run: |
          python3 scripts/verify-android-artifact.py --require-signed > android-artifact-report.json
          sha256sum android/app/build/outputs/bundle/release/app-release.aab > android-aab.sha256
      - name: Upload signed AAB and verification report
        uses: actions/upload-artifact@v7
        with:
          name: hailite-manager-play-${{ inputs.version_code }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android-artifact-report.json
            android-aab.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing material
        if: always()
        run: rm -f android/keystore.properties "$RUNNER_TEMP/hailite-upload.jks"
