name: Tester la transition onboarding

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: onboarding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  onboarding-transition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Installer Chrome (version épinglée)
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          # Épinglé sur la version que puppeteer-core cible (PUPPETEER_REVISIONS).
          # « stable » suivait le canal public : Chrome est passé de 141 à 151
          # entre deux exécutions et le test a commencé à échouer dès le premier
          # chargement de page, sans que rien n'ait changé dans l'application.
          # Un test qui dépend d'un navigateur non épinglé ne dit plus si le
          # code est bon — il dit quel Chrome est sorti ce matin.
          # À relever en même temps que puppeteer-core.
          chrome-version: 151.0.7922.47
      - name: Démarrer l’application de test
        env:
          VITE_LOCAL_TEST_MODE: 'true'
          VITE_CLOUD_SYNC_TEST_MODE: 'true'
        run: |
          npm run dev:client -- --port 4173 > /tmp/hailite-vite.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hailite-vite.log
          exit 1
      - name: Parcourir l’onboarding complet sans recharger
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          ONBOARDING_URL: http://127.0.0.1:4173
        run: node scripts/test-onboarding.mjs
      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: onboarding-transition-result
          path: onboarding-transition-test-result.json
          if-no-files-found: warn
