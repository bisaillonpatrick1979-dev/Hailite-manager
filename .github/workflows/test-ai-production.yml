name: Tester les IA de production

on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * *'
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read

jobs:
  test-ai:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      AI_TEST_BASE_URL: ${{ secrets.AI_TEST_BASE_URL }}
      AI_TEST_USER_NAME: ${{ secrets.AI_TEST_USER_NAME }}
      AI_TEST_PIN: ${{ secrets.AI_TEST_PIN }}
    steps:
      - uses: actions/checkout@v7
      - name: Tester connexion, variables et fournisseurs
        run: |
          python3 - <<'PY'
          import http.cookiejar
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          base = (os.environ.get('AI_TEST_BASE_URL') or 'https://hailite-manager.vercel.app').rstrip('/')
          user_name = os.environ.get('AI_TEST_USER_NAME', '').strip()
          pin = os.environ.get('AI_TEST_PIN', '').strip()
          cookies = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cookies))

          def request(path, method='GET', body=None, timeout=60):
              headers = {'Accept': 'application/json'}
              if body is not None:
                  headers['Content-Type'] = 'application/json'
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  with opener.open(req, timeout=timeout) as response:
                      raw = response.read().decode('utf-8', errors='replace')
                      return response.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as error:
                  raw = error.read().decode('utf-8', errors='replace')
                  try:
                      payload = json.loads(raw) if raw else {}
                  except Exception:
                      payload = {'error': raw[:300]}
                  return error.code, payload
              except Exception as error:
                  return 0, {'error': str(error)}

          result = {
              'testedAt': datetime.now(timezone.utc).isoformat(),
              'productionUrl': base,
              'credentialsConfigured': bool(user_name and len(pin) == 4),
              'providers': {}
          }

          directory_code, directory = request('/api/auth/directory')
          users = directory.get('users', []) if isinstance(directory, dict) else []
          selected = next((user for user in users if user.get('name') == user_name), None)
          login_code, login = (0, {'error': 'GitHub secrets or directory user missing'})
          if result['credentialsConfigured'] and selected:
              login_code, login = request('/api/auth/login', 'POST', {
                  'employeeId': selected.get('id'),
                  'nip': pin
              })

          status_code, status = request('/api/ai/status') if login_code == 200 else (0, {'error': 'not authenticated'})
          configured = {
              key: bool(value.get('configured'))
              for key, value in (status.get('providers', {}) if isinstance(status, dict) else {}).items()
          }

          for provider in ['anthropic', 'openai', 'gemini']:
              code, response = request('/api/chat', 'POST', {
                  'message': 'Réponds uniquement par le mot OK.',
                  'provider': provider,
                  'language': 'FR',
                  'allowActions': False
              }, timeout=90) if login_code == 200 else (0, {'error': 'not authenticated'})
              reply = str(response.get('reply', '')) if isinstance(response, dict) else ''
              result['providers'][provider] = {
                  'http': code,
                  'configured': configured.get(provider, False),
                  'providerReturned': response.get('provider') if isinstance(response, dict) else None,
                  'simulated': bool(response.get('simulated')) if isinstance(response, dict) else False,
                  'hasReply': bool(reply.strip()),
                  'error': response.get('error') if isinstance(response, dict) else 'invalid response'
              }

          # Le rapport ne disait que « loginHttp: 401 », ce qui ne permet pas de
          # distinguer un NIP erroné d'un blocage temporaire ou d'une base
          # indisponible. Le serveur renvoie pourtant un code précis : on le
          # conserve, avec un diagnostic en clair.
          login_code_name = login.get('code') if isinstance(login, dict) else None
          if login_code == 200:
              diagnostic = 'Connexion réussie.'
          elif not selected:
              diagnostic = (
                  'Aucun profil ne porte le nom AI_TEST_USER_NAME dans l’annuaire. '
                  'Vérifiez l’orthographe exacte du secret, accents compris.'
              )
          elif login_code_name == 'INVALID_CREDENTIALS':
              # Message d'origine : « réenregistrez AI_TEST_PIN ». Il envoyait sur
              # une fausse piste — un NIP parfaitement valide est refusé dès qu'il
              # appartient à quelqu'un d'autre que le profil nommé dans
              # AI_TEST_USER_NAME. Les deux secrets forment une paire.
              diagnostic = (
                  f'Le profil « {user_name} » existe, mais le NIP du secret AI_TEST_PIN '
                  'n’est pas le sien. Ce NIP est peut-être valide pour un autre compte : '
                  'la connexion se fait au nom indiqué dans AI_TEST_USER_NAME, et les deux '
                  'secrets doivent désigner la même personne. Vérifiez la paire avant de '
                  'toucher au NIP dans l’application.'
              )
          elif login_code_name == 'THROTTLED':
              diagnostic = 'Trop de tentatives récentes : le compte est temporairement bloqué.'
          elif login_code_name == 'AUTH_UNAVAILABLE':
              diagnostic = 'Base de données indisponible côté serveur.'
          else:
              diagnostic = f'Échec inattendu (HTTP {login_code}).'

          result.update({
              'directoryHttp': directory_code,
              # Le nom cherché et les noms disponibles : sans eux, un rapport qui
              # dit « profil trouvé, NIP refusé » ne permet pas de voir que les
              # deux secrets désignent deux personnes différentes. Ces noms sont
              # déjà publics — l'annuaire de l'écran de connexion les affiche.
              'userNameUsed': user_name,
              'directoryNames': sorted(str(user.get('name') or '') for user in users),
              'directoryUserFound': bool(selected),
              'loginHttp': login_code,
              'loginCode': login_code_name,
              'loginError': login.get('error') if isinstance(login, dict) else None,
              'diagnostic': diagnostic,
              'cookieCreated': len(cookies) > 0,
              'statusHttp': status_code,
              'configured': configured
          })
          result['allPassed'] = (
              result['credentialsConfigured'] and directory_code == 200 and login_code == 200 and
              result['cookieCreated'] and status_code == 200 and
              all(item['http'] == 200 and item['configured'] and item['hasReply'] and not item['simulated']
                  for item in result['providers'].values())
          )
          with open('ai-production-test-result.json', 'w', encoding='utf-8') as file:
              json.dump(result, file, ensure_ascii=False, indent=2)
          print(json.dumps(result, ensure_ascii=False, indent=2))
          if not result['allPassed']:
              sys.exit(1)
          PY
      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-production-test-result
          path: ai-production-test-result.json
          if-no-files-found: warn
