version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # typescript-eslint@8.x exige typescript >=4.8.4 <6.1.0.
      # Les majeures de TypeScript (6.x, 7.x) cassent le npm install (ERESOLVE).
      # A retirer quand on migrera vers typescript-eslint v9.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
